name: Ingest News

on:
  schedule:
    # Runs every hour during the day for fresh news throughout the day...
    - cron: "0 * * * *"
    # ...PLUS an explicit final pass at 23:45 IST (18:15 UTC) - like a
    # newspaper's print deadline, this captures anything published right up
    # to midnight before the 6-7AM email goes out. Adjust the UTC offset here
    # if your admin_timezone setting (in Settings) isn't Asia/Kolkata.
    - cron: "15 18 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call backend ingestion endpoint
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/internal/run-ingestion" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 120
