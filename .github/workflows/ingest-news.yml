name: Ingest News

on:
  schedule:
    # The backend database schedule is authoritative. This five-minute poll is
    # only a recovery trigger when the Render process misses a scheduler tick.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: morning-brief-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call backend schedule-aware ingestion endpoint with retries
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${BACKEND_URL}" || { echo "BACKEND_URL GitHub secret is missing"; exit 1; }
          test -n "${CRON_SECRET}" || { echo "CRON_SECRET GitHub secret is missing"; exit 1; }
          for attempt in 1 2 3 4 5; do
            if curl --fail --show-error --silent --retry 0 --max-time 120 \
              -X POST "${BACKEND_URL%/}/internal/run-ingestion" \
              -H "X-Cron-Secret: ${CRON_SECRET}"; then
              exit 0
            fi
            echo "Ingestion trigger failed (attempt ${attempt}/5)"
            sleep $((attempt * 10))
          done
          exit 1
