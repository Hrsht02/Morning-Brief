name: Ingest News

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "15 18 * * *" # 23:45 IST final pass
  workflow_dispatch: {}

concurrency:
  group: morning-brief-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call backend ingestion endpoint with retries
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --show-error --silent --retry 0 --max-time 120 \
              -X POST "${BACKEND_URL}/internal/run-ingestion" \
              -H "X-Cron-Secret: ${CRON_SECRET}"; then
              exit 0
            fi
            echo "Ingestion trigger failed (attempt ${attempt}/5)"
            sleep $((attempt * 10))
          done
          exit 1
