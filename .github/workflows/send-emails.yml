name: Send Daily Emails

on:
  schedule:
    # The backend database schedule is authoritative. This five-minute poll is
    # only a recovery trigger when the Render process misses a scheduler tick.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: morning-brief-email-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate required secrets
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${BACKEND_URL}" || { echo "BACKEND_URL GitHub secret is missing"; exit 1; }
          test -n "${CRON_SECRET}" || { echo "CRON_SECRET GitHub secret is missing"; exit 1; }

      - name: Call backend schedule-aware email endpoint with retries
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            response_file="$(mktemp)"
            http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --max-time 120 \
              -X POST "${BACKEND_URL%/}/internal/send-emails" \
              -H "X-Cron-Secret: ${CRON_SECRET}" || true)"
            echo "HTTP ${http_code}"
            cat "$response_file" || true
            rm -f "$response_file"
            if [ "$http_code" = "200" ]; then exit 0; fi
            echo "Email trigger failed (attempt ${attempt}/5)"
            sleep $((attempt * 10))
          done
          exit 1
