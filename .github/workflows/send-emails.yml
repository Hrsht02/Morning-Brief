name: Send Daily Emails

on:
  # Five-minute cadence supports the admin sandbox's one-shot test email.
  # Production subscriber delivery still respects each user's configured
  # one-hour send window, so this does not make production sends random.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: morning-brief-email-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run due safe sandbox test email
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 120 \
            -X POST "${BACKEND_URL}/admin/sandbox/test-email-schedule/run-due" \
            -H "X-Cron-Secret: ${CRON_SECRET}" || true

      - name: Call backend email endpoint with retries
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --show-error --silent --max-time 120 \
              -X POST "${BACKEND_URL}/internal/send-emails" \
              -H "X-Cron-Secret: ${CRON_SECRET}"; then
              exit 0
            fi
            echo "Email trigger failed (attempt ${attempt}/5)"
            sleep $((attempt * 10))
          done
          exit 1
