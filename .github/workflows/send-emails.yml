name: Send Daily Emails

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: morning-brief-email-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call backend email endpoint with retries
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --show-error --silent --max-time 120 \
              -X POST "${BACKEND_URL}/internal/send-emails" \
              -H "X-Cron-Secret: ${CRON_SECRET}"; then
              exit 0
            fi
            echo "Email trigger failed (attempt ${attempt}/5)"
            sleep $((attempt * 10))
          done
          exit 1
